<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign up — Instawork Research</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="demo-banner" role="status">Demo — production redirects to Instawork signup URL with UTMs.</div>

  <div class="page">
    <header class="site-header">
      <nav class="nav-container" aria-label="Primary navigation">
        <a class="brand" href="index.html" aria-label="Instawork Research home">
          <img class="brand-icon" src="/public/instawork_logo.png" alt="" aria-hidden="true">
          <span class="brand-name">Instawork <strong>Research</strong></span>
        </a>
        <div class="nav-actions">
          <a class="login-link" href="login.html" id="login-link">Log in</a>
        </div>
      </nav>
    </header>

    <main id="main-content" class="subpage-main">
      <div class="page-container">
        <h1 class="page-title">Sign up</h1>
        <p class="lead">Demo form only. Production opens Instawork onboarding with UTMs.</p>

        <div class="form-card">
          <form id="signup-form">
            <div class="form-group">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required>
            </div>
            <button class="primary-button" type="submit">Create account (demo)</button>
            <p class="form-note">This demo stores a flag in localStorage and redirects you.</p>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
